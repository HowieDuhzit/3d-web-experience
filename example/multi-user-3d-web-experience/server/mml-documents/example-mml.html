<m-group id="course-root" y="0">
  <m-cube id="ground" width="120" depth="240" height="1" y="-0.5" color="#1f2937"></m-cube>
  <m-cube id="start-platform" width="10" depth="10" height="1" y="0.5" z="0" color="#22c55e"></m-cube>
  <m-text value="START" y="2.5" z="0" font-size="1.2" color="#ffffff"></m-text>

  <m-cube width="4" depth="4" height="1" y="1" z="10" color="#38bdf8"></m-cube>
  <m-cube width="4" depth="4" height="1" y="1.5" z="18" color="#38bdf8"></m-cube>
  <m-cube width="4" depth="4" height="1" y="2" z="26" color="#38bdf8"></m-cube>

  <m-group id="moving-bridge" x="0" z="40" y="2">
    <m-cube id="bridge-platform" width="12" depth="4" height="0.6" color="#f97316">
      <m-attr-anim
        attr="x"
        start="-6"
        end="6"
        duration="4000"
        loop="true"
        ping-pong="true"
        easing="easeInOutQuart"
      ></m-attr-anim>
    </m-cube>
  </m-group>

  <m-group id="balance-beam" x="0" z="60" y="2.6">
    <m-cube width="18" depth="2" height="0.4" color="#a855f7"></m-cube>
  </m-group>

  <m-group id="spinner" x="0" z="78" y="2.8">
    <m-cylinder radius="0.6" height="1" color="#facc15"></m-cylinder>
    <m-cube id="spinner-arm" width="20" depth="1" height="0.4" y="0.2" color="#facc15">
      <m-attr-anim
        attr="ry"
        start="0"
        end="360"
        duration="3000"
        loop="true"
        easing="linear"
      ></m-attr-anim>
    </m-cube>
  </m-group>

  <m-group id="stepping-stones" z="100" y="3">
    <m-cube x="-6" width="4" depth="4" height="0.8" color="#14b8a6"></m-cube>
    <m-cube x="0" width="4" depth="4" height="0.8" color="#14b8a6"></m-cube>
    <m-cube x="6" width="4" depth="4" height="0.8" color="#14b8a6"></m-cube>
  </m-group>

  <m-group id="elevator" x="0" z="120">
    <m-cube id="elevator-platform" width="8" depth="8" height="0.6" y="2" color="#60a5fa">
      <m-attr-anim
        attr="y"
        start="2"
        end="10"
        duration="5000"
        loop="true"
        ping-pong="true"
        easing="easeInOutQuart"
      ></m-attr-anim>
    </m-cube>
  </m-group>

  <m-group id="stair-climb" x="0" z="145" y="2">
    <m-cube id="stair-base" width="10" depth="6" height="1" y="0" color="#334155"></m-cube>
  </m-group>

  <m-group id="finish" x="0" z="190" y="6">
    <m-cube width="14" depth="10" height="1" y="0" color="#22c55e"></m-cube>
    <m-text value="FINISH" y="3" font-size="1.4" color="#ffffff"></m-text>
  </m-group>
</m-group>

<script>
  const stairBase = document.getElementById("stair-base");
  const stairGroup = document.getElementById("stair-climb");

  for (let i = 0; i < 12; i++) {
    const stair = document.createElement("m-cube");
    stair.setAttribute("width", "6");
    stair.setAttribute("depth", "3");
    stair.setAttribute("height", "0.6");
    stair.setAttribute("y", (i + 1) * 0.6);
    stair.setAttribute("z", i * 1.8);
    stair.setAttribute("color", i % 2 === 0 ? "#64748b" : "#475569");
    stairGroup.appendChild(stair);
  }

  stairBase.addEventListener("collisionstart", () => {
    stairBase.setAttribute("color", "#fef9c3");
  });
  stairBase.addEventListener("collisionend", () => {
    stairBase.setAttribute("color", "#334155");
  });
</script>

<script>
  const spinner = document.getElementById("spinner");
  const bridgePlatform = document.getElementById("bridge-platform");

  function pulseColor(element, baseColor) {
    let isBright = false;
    element.addEventListener("collisionstart", () => {
      isBright = true;
      element.setAttribute("color", "#fef08a");
    });
    element.addEventListener("collisionend", () => {
      if (isBright) {
        element.setAttribute("color", baseColor);
      }
      isBright = false;
    });
  }

  pulseColor(spinner, "#facc15");
  pulseColor(bridgePlatform, "#f97316");
</script>
